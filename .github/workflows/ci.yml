name: CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-ci:
    name: Backend (Python / Django)
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: pje_automacao_test
      POSTGRES_USER: pje_automacao
      POSTGRES_PASSWORD: ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: pje_automacao_test
          POSTGRES_USER: pje_automacao
          POSTGRES_PASSWORD: ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pje_automacao -d pje_automacao_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend-automacao/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend-automacao/requirements.txt

      - name: Install Playwright Browsers
        run: |
          playwright install --with-deps chromium

      - name: Django System Check
        run: |
          cd backend-automacao
          python manage.py check

      - name: Run Backend Tests
        run: |
          cd backend-automacao
          python manage.py test

  frontend-ci:
    name: Frontend (TypeScript / Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint

      - name: Run Unit Tests
        run: |
          cd frontend
          npm run test

      - name: Build Next.js app
        run: |
          cd frontend
          npm run build
