services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?configure POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?configure POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    build: ./backend-automacao
    restart: unless-stopped
    shm_size: '2gb'
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?configure POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?configure POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD no .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      CORS_ALLOW_ALL_ORIGINS: "True"
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:3002,http://127.0.0.1:3002,http://10.0.2.15:3002,http://10.0.2.2:3002}
      PJE_COLLECTORS: ${PJE_COLLECTORS:-murilo}
      PJE_CREDENTIALS_FILE: /run/pje-automacao/project.env
      DJEN_OAB_NUMBER: ${DJEN_OAB_NUMBER:-5691}
      DJEN_OAB_STATE: ${DJEN_OAB_STATE:-RN}
    ports:
      - "8007:8007"
    volumes:
      - /run/pcscd/pcscd.comm:/run/pcscd/pcscd.comm
      - ./backend-automacao/respostas_expedientes:/app/respostas_expedientes
      - type: bind
        source: ./.env
        target: /run/pje-automacao/project.env
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build: ./backend-automacao
    restart: unless-stopped
    # Protege o notebook durante o uso conjunto de Java e Chromium.
    mem_limit: 512m
    memswap_limit: 1536m
    cpus: 1.0
    command: python manage.py processar_coletas
    shm_size: '2gb'
    environment:
      PJE_OFFICE_ENABLED: "true"
      PJE_COLLECTORS: ${PJE_COLLECTORS:-murilo}
      PJE_CREDENTIALS_FILE: /run/pje-automacao/project.env
      POSTGRES_DB: ${POSTGRES_DB:?configure POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?configure POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?configure POSTGRES_PASSWORD no .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DEBUG: ${DEBUG:-False}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
      DJEN_OAB_NUMBER: ${DJEN_OAB_NUMBER:-5691}
      DJEN_OAB_STATE: ${DJEN_OAB_STATE:-RN}
    volumes:
      - pjeoffice_worker_data:/root/.pjeoffice-pro
      - /run/pcscd/pcscd.comm:/run/pcscd/pcscd.comm
      - ./backend-automacao/respostas_expedientes:/app/respostas_expedientes
      - type: bind
        source: ./.env
        target: /run/pje-automacao/project.env
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8007
      PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      - backend

volumes:
  pjeoffice_worker_data:
  postgres_data:
